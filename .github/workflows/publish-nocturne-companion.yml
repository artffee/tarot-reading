name: Publish verified Nocturne companion
on:
  push:
    branches: [feat/nocturne-companion-book]
    paths:
      - companion/**
      - scripts/build-nocturne-companion.py
      - tests/companion-release-hashes.json
      - .github/workflows/publish-nocturne-companion.yml
permissions:
  contents: write
concurrency:
  group: publish-nocturne-companion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'artffee/tarot-reading' && github.ref == 'refs/heads/feat/nocturne-companion-book'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned PDF tools
        run: python3 -m pip install --user -r companion/requirements.txt
      - name: Rebuild and validate the complete book
        run: |
          python3 scripts/build-nocturne-companion.py
          python3 tests/verify-companion.py
      - name: Require the exact reviewed release bytes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for file,expected in json.loads(Path('tests/companion-release-hashes.json').read_text()).items():
              assert hashlib.sha256(Path(file).read_bytes()).hexdigest()==expected, file+' differs from the reviewed release'
          print('All release files match the locally reviewed bytes.')
          PY
      - name: Commit only the verified companion PDF
        run: |
          set -euo pipefail
          git add -- decks/gothic/downloads/nocturne-cathedral-companion.pdf
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish the verified 192-page Nocturne Cathedral companion PDF'
            git push origin HEAD:refs/heads/feat/nocturne-companion-book
          fi
