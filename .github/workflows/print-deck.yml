name: Build and verify printable deck

on:
  push:
    branches: [codex/publish-printable-deck]
    paths:
      - deck/print.*
      - cards/*.webp
      - tests/**
      - .github/workflows/print-deck.yml

permissions:
  contents: write

concurrency:
  group: printable-deck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  printable-deck:
    if: github.repository == 'artffee/tarot-reading' && github.ref == 'refs/heads/codex/publish-printable-deck'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install print verification dependencies
        run: |
          npm ci --prefix tests
          python3 -m pip install --user PyMuPDF==1.26.6 Pillow==12.3.0
          cd tests
          npx playwright install --with-deps chromium
      - name: Verify and build all eight downloadable editions
        run: npm run build:pdf --prefix tests
      - name: Commit verified PDFs to this release branch
        run: |
          set -euo pipefail
          git add -- deck/downloads/*.pdf
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish verified Letter and A4 deck PDFs for both duplex edges'
            git push origin HEAD:refs/heads/codex/publish-printable-deck
          fi
